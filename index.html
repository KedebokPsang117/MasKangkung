<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: biar HUD aman di layar poni / gesture bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#06070d" />
  <meta name="color-scheme" content="dark" />
  <title>Dimensi Tarik — Hologram Balok Hybrid</title>

  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />

  <!--
    FR2: es-module-shims WAJIB dimuat SEBELUM importmap.
    Tanpa ini, Chrome Android versi lama bisa gagal resolve "three".
  -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>

<body>
  <!-- Kanvas Three.js, full screen, paling belakang -->
  <canvas id="c"></canvas>

  <!-- Preview kamera kecil di kanan bawah (mirrored lewat CSS) -->
  <video id="video" playsinline muted autoplay></video>

  <!-- Container titik ujung jari; anak-anaknya dibuat oleh js/app.js -->
  <div id="fingers" aria-hidden="true"></div>

  <!-- Bar kedalaman di kiri: tinggi = fungsi dari scale kubus -->
  <div id="depthBar" aria-hidden="true">
    <div id="depthFill"></div>
  </div>

  <!-- Kartu UI utama -->
  <div id="ui" role="region" aria-label="Kontrol aplikasi">
    <div class="row">
      <span id="statusDot" class="dot idle" aria-hidden="true"></span>
      <span id="statusText">SIAP</span>
      <span id="modeLabel" aria-live="polite">MODE: IDLE</span>
    </div>
    <div class="row">
      <!-- FR3: getUserMedia dipanggil langsung dari handler tombol ini -->
      <button id="startBtn" type="button">Aktifkan Kamera</button>
      <!-- FR4: muncul hanya kalau semua CDN gagal -->
      <button id="retryBtn" type="button" class="hidden">Retry AI</button>
    </div>
  </div>

  <!-- Hint + debug log menempel di bawah -->
  <div id="bottom">
    <div id="hint">
      1 Tangan Cubit = Grab &amp; Tarik • 2 Tangan Cubit = Melar Bebas Arah
    </div>
    <pre id="debugLog" aria-live="polite"></pre>
  </div>

  <!-- FR2: entry point, dimuat sebagai module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
