<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>HOLOGRAM HYBRID - 2 Tangan Melar Bebas Arah</title>
<link rel="stylesheet" href="css/style.css">
<!-- biar importmap jalan di HP -->
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" autoplay playsinline muted></video>

<!-- dot 2D buat ujung jari -->
<div id="fingers"></div>
<div id="depthBar"><div id="depthFill"></div></div>

<div id="ui">
  <div class="card">
    <h1>HOLOGRAM HYBRID</h1>
    <p id="desc">1 tangan = balok nyatu ngikut posisi. 2 tangan cubit = <b>melar bebas arah</b> sesuai tarikan + putar.</p>
    <div id="status"><div id="dot" class="dot"></div><span id="statusText">Memuat AI...</span></div>
    <div id="mode" class="mode">MODE: -</div>
    <button id="startBtn" class="btn">Aktifkan Kamera & Mulai</button>
    <button id="retryAI" class="btn">Retry Load AI (ganti CDN)</button>
    <button id="debugBtn" class="btn">Lihat Log Debug</button>
  </div>
</div>

<div id="hint">👌 1 Tangan Cubit = Grab & Tarik • 🤲 2 Tangan Cubit = Melar Bebas Arah</div>
<div id="debugLog"><b>DEBUG LOG HYBRID v4:</b><br></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
