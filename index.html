<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dimensi Tarik - Spike</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; }
  video { display:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  #status { position:fixed; top:10px; left:10px; color:#7fd; font-family:monospace;
            font-size:12px; z-index:10; text-shadow:0 0 4px #000; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
           background:rgba(0,0,20,.85); z-index:20; }
  #start button { padding:16px 32px; font-size:18px; background:#123; color:#8ff;
                  border:1px solid #8ff; border-radius:8px; }
</style>
</head>
<body>
<div id="start"><button id="btn">Nyalakan Kamera Depan</button></div>
<div id="status">menunggu…</div>
<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
let landmarker = null;
let blockScale = 1;

// jempol=4, telunjuk=8, tengah=12, manis=16, kelingking=20
const FINGERTIPS = [4, 8, 12, 16, 20];

async function init() {
  status.textContent = "memuat model…";
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 1
  });
  status.textContent = "model siap";
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia(
    { video: { facingMode: "user" } });
  video.srcObject = stream;
  await video.play();
  document.getElementById('start').style.display = 'none';
  requestAnimationFrame(loop);
}

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

function loop() {
  if (video.readyState >= 2) {
    const now = performance.now();
    const results = landmarker.detectForVideo(video, now);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,10,0.35)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (results.landmarks && results.landmarks.length > 0) {
      const lm = results.landmarks[0];
      drawHand(lm);

      // skala dari jarak jempol–tengah
      const d = Math.hypot(lm[4].x - lm[12].x, lm[4].y - lm[12].y);
      blockScale = 0.6 + d * 3;

      // spawn saat kepalan parsial: ujung jari dekat pergelangan
      let fist = 0;
      for (const i of [8, 12, 16, 20]) {
        if (Math.hypot(lm[i].x - lm[0].x, lm[i].y - lm[0].y) < 0.18) fist++;
      }
      if (fist >= 2) drawBlockAndThreads(lm);
      else status.textContent = "buka tangan / kepal untuk spawn";
    } else {
      status.textContent = "tangan tidak terdeteksi";
    }
  }
  requestAnimationFrame(loop);
}

function pt(lm, i) {
  return { x: (1 - lm[i].x) * canvas.width, y: lm[i].y * canvas.height };
}

function drawHand(lm) {
  ctx.fillStyle = 'rgba(120,255,220,0.8)';
  for (let i = 0; i < 21; i++) {
    const p = pt(lm, i);
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBlockAndThreads(lm) {
  const palmPt = pt(lm, 9);
  const size = 60 * blockScale;
  const cx = palmPt.x, cy = palmPt.y - size * 1.2;

  // balok glow sederhana
  ctx.save();
  ctx.shadowColor = '#8ff'; ctx.shadowBlur = 25;
  ctx.strokeStyle = 'rgba(150,240,255,0.9)'; ctx.lineWidth = 2;
  ctx.strokeRect(cx - size/2, cy - size/2, size, size);
  ctx.fillStyle = 'rgba(120,220,255,0.12)';
  ctx.fillRect(cx - size/2, cy - size/2, size, size);
  ctx.restore();

  // 5 benang elastis ke 5 titik di balok
  const targets = [
    { x: cx - size/2, y: cy + size/2 },
    { x: cx,          y: cy - size/2 },
    { x: cx,          y: cy           },
    { x: cx + size/2, y: cy - size/2 },
    { x: cx + size/2, y: cy + size/2 },
  ];

  FINGERTIPS.forEach((fi, idx) => {
    const a = pt(lm, fi);
    const b = targets[idx];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const sag = Math.min(60, dist * 0.25);
    // tekukan jari → benang mengendur
    const pip = pt(lm, fi - 2);
    const bend = Math.hypot(a.x - pip.x, a.y - pip.y);
    const extraSag = bend < 40 ? 40 : 0;

    ctx.strokeStyle = 'rgba(180,255,255,0.7)';
    ctx.lineWidth = dist > 300 ? 1 : 2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo((a.x + b.x) / 2, (a.y + b.y) / 2 + sag + extraSag, b.x, b.y);
    ctx.stroke();
  });
  status.textContent = "scale: " + blockScale.toFixed(2);
}

document.getElementById('btn').addEventListener('click', async () => {
  try { await init(); await startCamera(); }
  catch (e) { status.textContent = "gagal: " + e.message; }
});
</script>
</body>
</html>
