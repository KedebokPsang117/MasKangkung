<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>DIMENSI TARIK - Hand Tracking</title>
<link rel="stylesheet" href="css/style.css">
<!-- es-module-shims biar importmap jalan di HP -->
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" autoplay playsinline muted></video>
<div id="depthBar"><div id="depthFill"></div></div>

<div id="ui">
  <div class="card">
    <h1>DIMENSI TARIK</h1>
    <p>Cubit jempol + telunjuk untuk grab balok. Maju-mundur tangan = balok membesar/mengecil kayak narik dimensi.</p>
    <div id="status"><div id="dot" class="dot"></div><span id="statusText">Memuat...</span></div>
    <button id="startBtn" class="btn">Aktifkan Kamera & Mulai</button>
    <button id="debugBtn" class="btn">Lihat Log Debug</button>
  </div>
</div>

<div id="hint">👌 Cubit untuk tarik • 🖐 Lepas untuk lepas</div>
<div id="debugLog"><b>DEBUG LOG:</b><br></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
